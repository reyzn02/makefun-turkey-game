<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — The Great Turkey Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a0e; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #ffd98a; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Gobble Dash: a turkey escapes Thanksgiving dinner. Jump with Space or a click, duck with Down, outrun Farmer Gus past the oven and the carving knife."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
